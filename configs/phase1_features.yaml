seed: 42
data:
  name: UJIIndoorLoc
  official_test: data/raw/validationData.csv
  sentinel: 100
  missing_rssi_dbm: -110
split:
  file: data/splits/folds.json
  method: GroupKFold
  n_splits: 5
  group: USERID
features:
  representations:
    - linear_positive
    - exponential
    - powed
  engineered:
    - detected_ap_count
    - strongest_rssi
    - strongest_wap_index
    - mean_observed_rssi
    - std_observed_rssi
    - top3_strongest_wap_indices
    - per_wap_missingness
  scaling: standard
  pca_components: [50, 100, 200]
  variance_threshold: 0.0
baseline:
  model: knn
  neighbors: 5
  weights: distance
